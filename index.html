  try { raw = (window.api && window.api.load()) || null; } catch (e) {}

})();

function dash(){
  const t = today(), pm = x => x.date.startsWith(t.slice(0, 7));
  const net = f => S(db.sales.filter(f), x => x.total) - S(db.sret.filter(f), x => x.total);
  const cards = [['مبيعات اليوم', net(x => x.date == t), '🛒'], ['مبيعات الشهر', net(pm), '📅'], ['أرباح الشهر', profit(pm), '💹'],
    ['ديون العملاء', S(db.customers, c => bal('customers', c.id)), '👥'], ['مستحق للموردين', S(db.suppliers, c => bal('suppliers', c.id)), '🏭'],
    ['رصيد الخزنة', cash(), '🏦'], ['مصروفات الشهر', S(db.expenses.filter(pm), x => x.amount), '💸'], ['قيمة المخزون', S(db.products, p => p.stock * p.cost), '📦']];
  const days = [...Array(7)].map((_, i) => { const d = ld(new Date(Date.now() - (6 - i) * 864e5)); return [d, net(x => x.date == d)]; });
  const mx = Math.max(...days.map(d => d[1]), 1);
  const low = db.products.filter(p => p.stock <= (p.min || 0));
  const top = db.products.map(p => [p.name, S(db.sales.filter(x => x.product == p.id), x => x.total)]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const rec = invs('sales').slice(-5).reverse();
  return `<div class="bar"><h1>📊 الصفحة الرئيسية</h1><span style="color:var(--m)">${t}</span></div>
  <div class="cards">${cards.map(c => `<div class="card"><small>${c[2]} ${c[0]}</small><b>${money(c[1])} ج.م</b></div>`).join('')}</div>
  <div class="two">
   <div class="pan"><h3>📈 ملخص المبيعات (آخر 7 أيام)</h3><div class="chart">${days.map(d => `<div class="col" title="${money(d[1])}"><i style="height:${d[1] / mx * 85}%"></i>${d[0].slice(5)}</div>`).join('')}</div></div>
   <div class="pan"><h3>⚠️ تنبيه نقص المخزون</h3>${low.length ? low.map(p => `<div>${esc(p.name)} <span class="bd r">المتبقي ${p.stock}</span></div>`).join('') : '<span class="bd g">المخزون كافي</span>'}</div>
   <div class="pan"><h3>🏆 أكثر المنتجات مبيعًا</h3>${top.map(x => `<div>${esc(x[0])} — <b>${money(x[1])}</b></div>`).join('') || '<small>لا توجد مبيعات</small>'}</div>
   <div class="pan"><h3>🧾 آخر الفواتير</h3>${rec.map(x => `<div>${x.date} — ${esc(nameOf('customers', x.party))} — <b>${money(x.total)}</b></div>`).join('') || '<small>لا توجد فواتير</small>'}</div>
  </div>`;
}

const EH = {sales:['الإجمالي', 'المتبقي'], purchases:['الإجمالي', 'المتبقي'], sret:['القيمة'], pret:['القيمة'], customers:['المتبقي'], suppliers:['المتبقي'], products:['الحالة']};
function extra(k, r){
  if (k == 'sales' || k == 'purchases') return [money(r.total), money(r.total - r.paid)];
  if (k == 'sret' || k == 'pret') return [money(r.total)];
  if (k == 'customers' || k == 'suppliers') return [money(bal(k, r.id))];
  if (k == 'products') return [r.stock <= (r.min || 0) ? '<span class="bd r">منخفض</span>' : '<span class="bd g">متاح</span>'];
  return [];
}
function act(k, r){
  let h = '';
  if (BM[k]) h += `<button class="btn sm s" onclick="openM('${k == 'customers' ? 'cpay' : 'spay'}',null,{party:'${r.id}'})">💰 دفعة</button><button class="btn sm i" onclick="stmt('${k}','${r.id}')">📄 كشف حساب</button>`;
  if (k == 'sales' || k == 'purchases') h += `<button class="btn sm i" onclick="pinv('${k}','${r.id}')">🖨 فاتورة</button>`;
  if (!ST[k]) h += `<button class="btn sm w" onclick="openM('${k}','${r.id}')">✏️ تعديل</button>`;
  return h + `<button class="btn sm d" onclick="del('${k}','${r.id}')">🗑 حذف</button>`;
}
function pcards(k){

    <div class="qb st"><div><small>عدد الفواتير</small><b>${nv}</b></div><div><small>${k=='customers'?'المبيعات':'المشتريات'}</small><b>${money(S(A,x=>x.total))}</b></div><div><small>المرتجعات</small><b>${money(S(B,x=>x.total))}</b></div><div><small>المدفوع</small><b>${money(pd)}</b></div></div>
    ${r.open?`<div class="sub">رصيد افتتاحي: ${money(r.open)}</div>`:''}
    <div class="row"><span>المتبقي</span><span class="amt">${money(Math.abs(b))} ج.م</span></div>
    <div class="ft">${act(k,r)}</div></div>`}).join('');

  <div class="cards"><div class="card"><small>العدد</small><b>${db[k].length}</b></div><div class="card"><small>إجمالي المتبقي</small><b>${money(tot)}</b></div></div>

function adjCards(){

  $('mt').textContent = (id ? '✏️ تعديل: ' : '➕ إضافة: ') + M[k].t;

      const [kind, src] = t.split(':');

function save0(){
  const rec = {};
  for (const [f, l, t = 'text', o] of M[mk].f) {
    let v = $('f_' + f).value.trim();
    if (t == 'number') { v = parseFloat(v) || 0; if (v < 0) { alert('قيمة غير صحيحة: ' + l); return; } }
    else if (!o && !v) { alert('أكمل: ' + l); return; }
    if ((f == 'qty' || f == 'amount') && v <= 0) { alert('أدخل ' + l); return; }
    rec[f] = v;

  let p;
  if (ST[mk]) {
    p = db.products.find(x => x.id == rec.product);

  else { rec.id = Date.now() + Math.random().toString(36).slice(2, 5); db[mk].push(rec); }
  store(); closeM(); render();
}
function del0(k, id){

    const l = bytes.length, n = (((l + 9) >> 6) + ((l + 9) & 63 ? 1 : 0)) << 6, m = new Uint8Array(n);
    m.set(bytes); m[l] = 0x80;
    const dv = new DataView(m.buffer); dv.setUint32(n - 4, l * 8 >>> 0); dv.setUint32(n - 8, Math.floor(l / 0x20000000));

    for (let o = 0; o < n; o += 64) {
      for (let i = 0; i < 16; i++) W[i] = dv.getUint32(o + i * 4);
      for (let i = 16; i < 64; i++) {
        const x = W[i - 15], y = W[i - 2];

      }

      for (let i = 0; i < 64; i++) {
        const t1 = (h + (((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7))) + ((e & f) ^ (~e & g)) + K[i] + W[i]) >>> 0;

      }
      a0 = (a0 + a) >>> 0; b0 = (b0 + b) >>> 0; c0 = (c0 + c) >>> 0; d0 = (d0 + d) >>> 0; e0 = (e0 + e) >>> 0; f0 = (f0 + f) >>> 0; g0 = (g0 + g) >>> 0; h0 = (h0 + h) >>> 0;
    }

    [a0, b0, c0, d0, e0, f0, g0, h0].forEach((v, i) => ov.setUint32(i * 4, v));

})();

const U8 = s => new TextEncoder().encode(s);

function fixDupNos(){   // لو جهازين عملوا نفس رقم فاتورة أوفلاين: الأقدم يحتفظ برقمه والأحدث ياخد رقم جديد
  Object.keys(ST).forEach(k => {
    const g = invs(k); let mx = Math.max(0, ...g.map(invNo)); const seen = {};
    g.slice().sort((a, b) => String(a.inv).localeCompare(String(b.inv))).forEach(x => {
      const n = invNo(x); if (!n) return;
      if (seen[n]) { mx++; x.rows.forEach(r => { r.no = mx; r._m = NOWS(); }); } else seen[n] = 1;
    });
  });
}

const srvTok = c => hex(sha(U8('tok|' + c.ws + '|' + c.key)));
const b64 = u => { let s = ''; for (let i = 0; i < u.length; i += 32768) s += String.fromCharCode.apply(null, u.subarray(i, i + 32768)); return btoa(s); };
const unb64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
async function srvKey(c){
  const id = c.ws + '|' + c.key; if (srvK && srvKid == id) return srvK;
  if (!(window.crypto && crypto.subtle)) throw new Error('التشفير غير متاح هنا — افتح البرنامج من رابط https');
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(c.key), 'PBKDF2', false, ['deriveKey']);
  srvK = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: new TextEncoder().encode('acc-sync|' + c.ws), iterations: 150000, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, false, ['encrypt', 'decrypt']);
  srvKid = id; return srvK;
}
async function srvEnc(k, t){ const iv = crypto.getRandomValues(new Uint8Array(12)), ct = new Uint8Array(await crypto.subtle.encrypt({name: 'AES-GCM', iv}, k, new TextEncoder().encode(t))); return JSON.stringify({a: 1, iv: b64(iv), c: b64(ct)}); }
async function srvDec(k, b){ const o = typeof b == 'string' ? JSON.parse(b) : b; try { return new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: unb64(o.iv)}, k, unb64(o.c))); } catch (e) { throw new Error('تعذر فك التشفير — مفتاح المزامنة غير مطابق'); } }
function srvSoon(ms){ const c = db.cfg.srv; if (!c || !c.on) return; clearTimeout(srvT); srvT = setTimeout(() => srvSync(true), ms || 4000); }
const srvLocked = () => !$('lock') || $('lock').style.display != 'none';
async function srvSync(quiet){
  const c = db.cfg.srv; if (!c || !c.on || !(SRV_URL || c.url) || !c.ws || !c.key || srvBusy) return false;
  if (srvLocked()) return false;
  if (modalOpen()) { srvSoon(5000); return false; }
  srvBusy = true; if (!quiet) srvSet('🔄 جاري المزامنة...');
  let changedAny = false;
  try {
    const url = (SRV_URL || c.url).replace(/\/+$/, '') + '/v1/' + encodeURIComponent(c.ws), H = {Authorization: 'Bearer ' + srvTok(c)}, ck = await srvKey(c);
    for (let i = 0; i < 4; i++) {
      const t0 = Date.now(), r = await fetch(url, {headers: H, cache: 'no-store'}), t1 = Date.now();
      let ver = 0;
      if (r.status == 401 || r.status == 403 || r.status == 429) throw new Error(r.status == 429 ? 'محاولات كتير غلط — استنى شوية' : r.status == 403 ? 'السيرفر مش بيقبل معرّف الشركة ده' : 'مفتاح المزامنة غير صحيح لهذه الشركة');
      if (r.status == 404) { const j = await r.json().catch(() => ({})); if (j.t) c.off = Math.round(j.t - (t0 + t1) / 2); }
      else if (r.ok) { const j = await r.json(); c.off = Math.round(j.t - (t0 + t1) / 2); ver = j.v; if (mergeText(await srvDec(ck, j.blob))) changedAny = true; }
      else throw new Error('السيرفر رد بخطأ ' + r.status);
      const cur = canon();
      if (ver > 0 && cur === c.up && ver === c.v) break;      // مفيش جديد نرفعه
      const p = await fetch(url, {method: 'PUT', headers: Object.assign({'Content-Type': 'application/json'}, H), body: JSON.stringify({base: ver, blob: await srvEnc(ck, bk())})});
      if (p.ok) { const j = await p.json(); c.v = j.v; c.up = cur; break; }
      if (p.status == 409) continue;
      if (p.status == 401 || p.status == 403) throw new Error('السيرفر رفض الرفع (' + p.status + ')');
      throw new Error('تعذر الرفع (' + p.status + ')');
    }
    c.last = Date.now(); try { localStorage.setItem('acc2', JSON.stringify(db)); } catch (e) {}
    if (window.api) try { window.api.save(JSON.stringify(db)); } catch (e) {}
    srvSet('✅ ' + new Date(c.last).toLocaleTimeString('ar-EG') + (changedAny ? ' (اتدمجت تعديلات جديدة)' : ''));
    if (changedAny && !modalOpen()) { menu(); render(); }
    return true;
  } catch (e) { srvSet('⚠️ ' + (e instanceof TypeError ? 'غير متصل بالسيرفر — هتتزامن لما النت يرجع' : (e && e.message || e))); return false; }
  finally { srvBusy = false; }
}
async function srvSave(){
  const code = $('sv_code').value.trim(), m = code.match(/^([A-Za-z0-9_-]{6,64})\.([A-Za-z0-9]{12,80})$/);
  const u = SRV_URL || ($('sv_u') ? $('sv_u').value.trim().replace(/\/+$/, '') : '');
  if (!/^https?:\/\/[^\s]+$/i.test(u)) { alert('رابط السيرفر لازم يبدأ بـ https://'); return; }
  if (!m) { alert('كود الربط غير صحيح. اكتبه زي ما استلمته بالظبط.'); return; }
  db.cfg.srv = {url: SRV_URL ? '' : u, ws: m[1], key: m[2], on: 1, v: 0, up: '', off: 0}; srvK = null; store();
  srvSet('🔄 جاري أول مزامنة...'); const ok = await srvSync(false); render();
  if (!ok && /غير صحيح|مش بيقبل/.test(srvMsg)) { db.cfg.srv = null; store(); render(); srvSet('⚠️ كود الربط مرفوض من السيرفر'); }
}
function srvStop(){ if (db.cfg.srv) { db.cfg.srv.on = 0; store(); } render(); }
function srvStart(){ if (db.cfg.srv) { db.cfg.srv.on = 1; store(); srvSoon(300); } render(); }
function srvUnlink(){ if (!confirm('فك الربط؟ بياناتك هتفضل على الجهاز، وتقدر تربط تاني بنفس الكود.')) return; db.cfg.srv = null; srvK = null; store(); srvSet(''); render(); }
function srvNow(){ srvSync(false); }
function srvSec(){
  const c = db.cfg.srv;
  if (c && c.ws && c.key) {
    return `<h3>☁️ المزامنة التلقائية</h3>
  <div id="srvmsg" style="margin:6px 0;color:var(--m)">${esc(srvMsg || (c.on ? '✅ مفعّلة' : 'متوقفة'))}</div>
  <div style="margin-top:6px">${c.on ? '<button class="btn p" onclick="srvNow()">🔄 مزامنة الآن</button><button class="btn" onclick="srvStop()">⏸ إيقاف مؤقت</button>' : '<button class="btn p" onclick="srvStart()">▶ تشغيل</button>'}<button class="btn d" onclick="srvUnlink()">فك الربط</button></div><hr>`;
  }
  return `<h3>☁️ المزامنة التلقائية</h3>
  <small style="color:var(--m)">اكتب كود الربط اللي استلمته. البيانات بتتشفّر على جهازك قبل الرفع، وكل كود ليه بياناته المنفصلة.</small>
  ${SRV_URL ? '' : '<label>رابط السيرفر</label><input id="sv_u" dir="ltr" placeholder="https://...">'}
  <label>كود الربط</label><input id="sv_code" dir="ltr" type="password" autocomplete="off" placeholder="co-xxxxxxxxxx.XXXXXXXXXXXXXXXXXXXXXXXX">
  <div style="margin-top:6px"><button class="btn p" onclick="srvSave()">🔗 ربط</button><button class="btn" onclick="$('sv_code').type=$('sv_code').type=='password'?'text':'password'">👁</button></div>
  <div id="srvmsg" style="margin:6px 0;color:var(--m)">${esc(srvMsg)}</div><hr>`;
}
{ const _ss = syncSec; syncSec = function(){ return srvSec() + _ss(); }; }
setInterval(() => srvSync(true), 60000);
window.addEventListener('online', () => srvSoon(1500));
document.addEventListener('visibilitychange', () => { if (!document.hidden) srvSoon(1500); });
setTimeout(() => srvSoon(500), 3000);

boot();
